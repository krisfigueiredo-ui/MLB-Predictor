# COURTSIDE IQ — full stack.  `cp .env.example .env` then `docker compose up --build`.
# Without provider keys the stack starts in clearly-labelled DEMO mode.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtside}
      POSTGRES_DB: courtside
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://courtside:${POSTGRES_PASSWORD:-courtside}@db:5432/courtside
      REDIS_URL: redis://redis:6379/0
      ENABLE_SCHEDULER: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes: [artifacts:/app/artifacts, rawdata:/app/data/raw]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://courtside:${POSTGRES_PASSWORD:-courtside}@db:5432/courtside
      REDIS_URL: redis://redis:6379/0
    volumes: [artifacts:/app/artifacts]
    depends_on:
      api: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata: {}
  artifacts: {}
  rawdata: {}
