name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (source: GitHub Actions) on first run, so
          # no manual Settings -> Pages step is needed.
          enablement: true

      - name: Stage the site
        run: |
          mkdir -p _site/js _site/icons
          cp index.html _site/
          cp js/*.js _site/js/
          # sw.js must sit beside index.html so its scope covers the whole app.
          cp sw.js _site/
          cp manifest.webmanifest _site/
          cp icons/* _site/icons/

      - name: Verify the deployable set
        run: |
          set -e
          for f in index.html sw.js manifest.webmanifest \
                   icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png \
                   icons/apple-touch-icon.png js/ms-app.js js/ms-pwa.js; do
            test -s "_site/$f" || { echo "missing or empty: _site/$f"; exit 1; }
          done
          # Every script index.html loads must actually ship.
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("_site/index.html", "utf8");
            const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]);
            const missing = srcs.filter(s => !fs.existsSync("_site/" + s));
            if (missing.length) { console.error("script tags with no file:", missing); process.exit(1); }
            console.log("index.html loads", srcs.length, "scripts, all present");
          '
          # Every asset the service worker precaches must actually ship, or the
          # app installs with a broken offline shell.
          node -e '
            const fs = require("fs");
            globalThis.MS = {};
            new Function("self", fs.readFileSync("js/ms-pwa.js", "utf8"))(globalThis);
            const missing = globalThis.MS.pwa.SHELL_ASSETS
              .filter(a => a !== "./")
              .map(a => "_site/" + a.replace(/^\.\//, ""))
              .filter(p => !fs.existsSync(p));
            if (missing.length) { console.error("precache targets missing:", missing); process.exit(1); }
            console.log("precache list resolves:", globalThis.MS.pwa.SHELL_ASSETS.length, "assets");
          '
          # The manifest must parse and every icon it names must exist.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("_site/manifest.webmanifest", "utf8"));
            const missing = m.icons.map(i => "_site/" + i.src).filter(p => !fs.existsSync(p));
            if (missing.length) { console.error("manifest icons missing:", missing); process.exit(1); }
            console.log("manifest parses;", m.icons.length, "icons,", m.shortcuts.length, "shortcuts");
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
