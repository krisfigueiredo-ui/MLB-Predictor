name: COURTSIDE IQ

on:
  push:
    paths: ["courtside-iq/**", ".github/workflows/courtside-iq.yml"]
  pull_request:
    paths: ["courtside-iq/**", ".github/workflows/courtside-iq.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: courtside
          POSTGRES_PASSWORD: courtside
          POSTGRES_DB: courtside
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtside" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: courtside-iq/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: courtside-iq/backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -r requirements.txt
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://courtside:courtside@localhost:5432/courtside' || '' }}
        run: python -m pytest -q
      - name: Migrations apply cleanly
        if: matrix.database == 'sqlite'
        run: DATABASE_URL=sqlite:///./migrate-check.db alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courtside-iq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: courtside-iq/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t courtside-api courtside-iq/backend
      - run: docker build -t courtside-web courtside-iq/frontend
